# 매일 새벽 3시(한국 시간)에 축제 데이터를 받아 GitHub Pages로 공개한다.
# 실패하면 배포하지 않아 어제 파일이 그대로 남는다. 손으로 돌리려면 Actions 탭에서 Run workflow.
name: update festivals

on:
  schedule:
    - cron: '0 18 * * *' # UTC 18:00 = 한국 03:00
  workflow_dispatch:

permissions:
  contents: write # 아래 매달 빈 커밋용
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # GitHub는 공개 저장소에 60일 동안 커밋이 없으면 예약 실행을 멈춘다. 매달 1일 빈 커밋으로 살려 둔다
      - name: keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          [ "$(date -u +%d)" = "01" ] || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m 'keepalive: monthly commit so the daily schedule keeps running'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node fetch-festivals.mjs
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
